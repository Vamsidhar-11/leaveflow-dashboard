<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeaveFlow Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, shipped SaaS product for HR teams
   IDEA: a leave register — every request is a line that moves Pending → Approved
   PICTURE: the working dashboard itself (requests queue + team week calendar)
   COLOUR/TYPE: white / ink, indigo-free: deep teal #0f5c55 primary, orange #ff6a2b accent; Geist
   LAYOUT: sidebar + top bar, KPI row, queue left, calendar & balances right; stacks on phone */
:root{color-scheme:light dark;
--bg:light-dark(#f4f5f6,#111315);--card:light-dark(#fff,#1a1d20);--ink:light-dark(#14171a,#eceef0);
--mut:light-dark(#62686f,#9aa1a8);--line:light-dark(#e3e6e9,#2a2e33);--pri:light-dark(#0f5c55,#3fb8a9);
--pri-soft:light-dark(#e3f1ef,#163a36);--acc:#ff6a2b;--ok:light-dark(#1d7a3e,#4cc77a);--ok-soft:light-dark(#e4f4e9,#173323);
--bad:light-dark(#b42318,#f26d63);--bad-soft:light-dark(#fdecea,#3a1d1b);--warn:light-dark(#9a5b00,#f0b04a);--warn-soft:light-dark(#fff4e0,#3a2c14)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;padding:0 8px 18px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--pri);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--mut);border:0;background:none;text-align:left;width:100%;min-height:42px}
.nav.on{background:var(--pri-soft);color:var(--pri);font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:13px;color:var(--mut);padding:12px}
main{padding:20px clamp(16px,3vw,32px) 40px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:22px}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:600}
.sub{color:var(--mut);margin:2px 0 0;font-size:14px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:7px;min-height:38px;color:var(--mut)}
.seg button.on{background:var(--pri);color:#fff}
.btn{border:0;background:var(--acc);color:#fff;padding:10px 16px;border-radius:9px;font-weight:500;min-height:42px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.kpi .l{color:var(--mut);font-size:13px}
.kpi .v{font-size:30px;font-weight:600;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.col{display:flex;flex-direction:column;gap:18px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch h2{font-size:16px;margin:0;font-weight:600}
.ch input,.ch select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;min-height:38px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mut);font-size:13px;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:12px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.nm{font-weight:500;white-space:nowrap}.dp{font-size:12px;color:var(--mut)}
.nowrap{white-space:nowrap}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.p-pending{background:var(--warn-soft);color:var(--warn)}.p-approved{background:var(--ok-soft);color:var(--ok)}.p-rejected{background:var(--bad-soft);color:var(--bad)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.ib{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px;min-height:34px}
.ib.ok{color:var(--ok)}.ib.no{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:28px 0}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px;background:var(--bg)}
.day.today{border-color:var(--pri)}
.day b{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-bottom:6px}
.chip{display:block;font-size:12px;padding:3px 6px;border-radius:6px;margin-bottom:4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{margin-bottom:12px}
.bar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar .t span:last-child{color:var(--mut);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
form{display:grid;gap:12px}
label{font-size:13px;color:var(--mut);display:grid;gap:5px}
form input,form select,form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:16px;min-height:44px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--mut)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;transition:transform .25s;z-index:9}
.toast{opacity:0;visibility:hidden}.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){.fill,.toast{transition:none}}
@media(max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr)}aside{flex-direction:row;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.logo{padding:0 8px 0 0}.side-foot{display:none}.nav{width:auto;white-space:nowrap;flex:none}.logo{flex:none}}
@media(max-width:600px){h1{font-size:22px}.week{grid-template-columns:minmax(0,1fr)}.day{min-height:0}
.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:block;border:0;padding:3px 0;text-align:start}.stack td:empty{display:none}.acts{justify-content:flex-start}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><i>L</i>LeaveFlow</div>
  <button class="nav on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</button>
  <button class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Requests</button>
  <button class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Team calendar</button>
  <button class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Employees</button>
  <button class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Reports</button>
  <div class="side-foot">Prototype · sample data</div>
</aside>

<main>
  <div class="top">
    <div><h1 id="title">Good evening, Priya</h1><p class="sub" id="subtitle">HR Admin · Acme Technologies · 42 employees</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="seg" role="tablist"><button class="on" id="vHR" role="tab">HR view</button><button id="vEmp" role="tab">Employee view</button></div>
    </div>
  </div>

  <!-- HR VIEW -->
  <section id="hr">
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <div class="col">
        <div class="card">
          <div class="ch"><h2>Leave requests</h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <input id="q" type="search" placeholder="Search employee" aria-label="Search employee">
              <select id="f" aria-label="Filter status"><option value="all">All</option><option value="pending" selected>Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
            </div></div>
          <table class="stack"><thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
        </div>
        <div class="card">
          <div class="ch"><h2>Who's off this week</h2><span class="note">24 – 28 Nov</span></div>
          <div class="week" id="week"></div>
        </div>
      </div>
      <div class="col">
        <div class="card">
          <div class="ch"><h2>Leave taken by type</h2><span class="note">This quarter</span></div>
          <div id="types"></div>
        </div>
        <div class="card">
          <div class="ch"><h2>Department availability</h2><span class="note">Today</span></div>
          <div id="depts"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- EMPLOYEE VIEW -->
  <section id="emp" class="hide">
    <div class="kpis" id="bal"></div>
    <div class="grid">
      <div class="card">
        <div class="ch"><h2>Apply for leave</h2></div>
        <form id="apply">
          <div class="two">
            <label>Leave type<select id="aType"><option>Casual</option><option>Sick</option><option>Earned</option><option>Work from home</option></select></label>
            <label>Half day?<select id="aHalf"><option value="0">No</option><option value="1">Yes</option></select></label>
          </div>
          <div class="two">
            <label>From<input type="date" id="aFrom" required value="2026-12-01"></label>
            <label>To<input type="date" id="aTo" required value="2026-12-02"></label>
          </div>
          <label>Reason<textarea id="aReason" rows="3" placeholder="Short note for your manager"></textarea></label>
          <p class="note" id="aCalc"></p>
          <button class="btn" type="submit">Submit request</button>
        </form>
      </div>
      <div class="card">
        <div class="ch"><h2>My requests</h2></div>
        <table class="stack"><thead><tr><th>Type</th><th>Dates</th><th>Days</th><th>Status</th></tr></thead><tbody id="mine"></tbody></table>
      </div>
    </div>
  </section>
</main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
{
const C={Casual:'#0f5c55',Sick:'#c2410c',Earned:'#2f6fd6','Work from home':'#7a6a00'};
const people={
 'Arjun Rao':['AR','Engineering','#2f6fd6'],'Meera Iyer':['MI','Design','#b4377a'],'Rahul Verma':['RV','Sales','#0f766e'],
 'Sneha Kapoor':['SK','Engineering','#7c4dbd'],'Kiran Das':['KD','Support','#c2410c'],'Ananya Singh':['AS','Marketing','#1d7a3e'],
 'Vikram Nair':['VN','Finance','#5b6470'],'Vamsi M':['VM','Engineering','#0f5c55']};
let reqs=[
 {id:1,n:'Arjun Rao',t:'Casual',f:'2026-11-26',to:'2026-11-27',d:2,s:'pending',r:'Family function'},
 {id:2,n:'Meera Iyer',t:'Sick',f:'2026-11-24',to:'2026-11-25',d:2,s:'pending',r:'Fever'},
 {id:3,n:'Rahul Verma',t:'Earned',f:'2026-12-08',to:'2026-12-12',d:5,s:'pending',r:'Vacation'},
 {id:4,n:'Sneha Kapoor',t:'Work from home',f:'2026-11-28',to:'2026-11-28',d:1,s:'pending',r:'Internet installation'},
 {id:5,n:'Kiran Das',t:'Casual',f:'2026-11-24',to:'2026-11-24',d:1,s:'approved',r:'Bank work'},
 {id:6,n:'Ananya Singh',t:'Earned',f:'2026-11-25',to:'2026-11-28',d:4,s:'approved',r:'Travel'},
 {id:7,n:'Vikram Nair',t:'Sick',f:'2026-11-18',to:'2026-11-18',d:1,s:'rejected',r:'No medical note'},
 {id:8,n:'Vamsi M',t:'Casual',f:'2026-11-10',to:'2026-11-10',d:1,s:'approved',r:'Personal'}];
let bal={Casual:{u:4,t:12},Sick:{u:2,t:8},Earned:{u:6,t:18}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const range=r=>r.f===r.to?fmt(r.f):fmt(r.f)+' – '+fmt(r.to);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)};
const today='2026-11-24';
const onDay=(r,d)=>r.s==='approved'&&r.f<=d&&r.to>=d;

function kpis(){
 const p=reqs.filter(r=>r.s==='pending').length;
 const off=reqs.filter(r=>onDay(r,today)).length;
 const appr=reqs.filter(r=>r.s==='approved').reduce((a,r)=>a+r.d,0);
 const k=[['On leave today',off,'of 42 employees'],['Pending approvals',p,p?'Oldest waiting 2 days':'All caught up'],['Days approved (Nov)',appr,'+18% vs Oct'],['Avg. approval time','5.2h','Target under 24h']];
 $('#kpis').innerHTML=k.map(x=>`<div class="card kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}</div><div class="d">${x[2]}</div></div>`).join('');
}
function rows(){
 const q=$('#q').value.toLowerCase(),f=$('#f').value;
 const list=reqs.filter(r=>(f==='all'||r.s===f)&&r.n.toLowerCase().includes(q));
 $('#rows').innerHTML=list.length?list.map(r=>{const p=people[r.n];return `<tr>
  <td><div class="who"><span class="av" style="background:${p[2]}">${p[0]}</span><div><div class="nm">${esc(r.n)}</div><div class="dp">${p[1]} · ${esc(r.r)}</div></div></div></td>
  <td><span class="pill" style="background:${C[r.t]}22;color:${C[r.t]}">${r.t}</span></td>
  <td class="nowrap">${range(r)}</td><td>${r.d}</td>
  <td><span class="pill p-${r.s}">${r.s[0].toUpperCase()+r.s.slice(1)}</span></td>
  <td>${r.s==='pending'?`<div class="acts"><button class="ib ok" data-a="approved" data-id="${r.id}">Approve</button><button class="ib no" data-a="rejected" data-id="${r.id}">Reject</button></div>`:''}</td></tr>`}).join('')
 :`<tr><td colspan="6" class="empty">No requests match. Nice — the queue is clear.</td></tr>`;
}
function week(){
 const days=['2026-11-24','2026-11-25','2026-11-26','2026-11-27','2026-11-28'],lab=['Mon 24','Tue 25','Wed 26','Thu 27','Fri 28'];
 $('#week').innerHTML=days.map((d,i)=>{const w=reqs.filter(r=>onDay(r,d));
  return `<div class="day${d===today?' today':''}"><b>${lab[i]}${d===today?' · Today':''}</b>${w.length?w.map(r=>`<span class="chip" style="background:${C[r.t]}" title="${esc(r.n)} · ${r.t}">${esc(r.n.split(' ')[0])}</span>`).join(''):'<span class="note">Everyone in</span>'}</div>`}).join('');
}
function types(){
 const tot={Casual:31,Sick:18,Earned:44,'Work from home':22};
 reqs.filter(r=>r.s==='approved'&&r.id>100).forEach(r=>tot[r.t]+=r.d);
 const max=Math.max(...Object.values(tot));
 $('#types').innerHTML=Object.entries(tot).map(([k,v])=>`<div class="bar"><div class="t"><span>${k}</span><span>${v} days</span></div><div class="track"><div class="fill" style="width:${v/max*100}%;background:${C[k]}"></div></div></div>`).join('');
 const dep=[['Engineering',16,18],['Sales',7,8],['Design',4,5],['Support',5,6],['Marketing',4,5]];
 $('#depts').innerHTML=dep.map(([n,a,t])=>`<div class="bar"><div class="t"><span>${n}</span><span>${a}/${t} available</span></div><div class="track"><div class="fill" style="width:${a/t*100}%;background:${a/t<.8?'var(--acc)':'var(--pri)'}"></div></div></div>`).join('');
}
function emp(){
 $('#bal').innerHTML=Object.entries(bal).map(([k,b])=>`<div class="card kpi"><div class="l">${k} leave</div><div class="v">${b.t-b.u}<span style="font-size:15px;color:var(--mut);font-weight:400"> / ${b.t} left</span></div><div class="track" style="margin-top:8px"><div class="fill" style="width:${(b.t-b.u)/b.t*100}%;background:${C[k]}"></div></div></div>`).join('')
  +`<div class="card kpi"><div class="l">Next holiday</div><div class="v" style="font-size:22px">Christmas</div><div class="d">Fri, 25 Dec</div></div>`;
 const mine=reqs.filter(r=>r.n==='Vamsi M');
 $('#mine').innerHTML=mine.map(r=>`<tr><td>${r.t}</td><td class="nowrap">${range(r)}</td><td>${r.d}</td><td><span class="pill p-${r.s}">${r.s[0].toUpperCase()+r.s.slice(1)}</span></td></tr>`).join('');
 calc();
}
function calc(){
 const f=$('#aFrom').value,t=$('#aTo').value;
 if(!f||!t||t<f){$('#aCalc').textContent='End date must be on or after start date.';return 0}
 let d=0;for(let x=new Date(f+'T00:00');x<=new Date(t+'T00:00');x.setDate(x.getDate()+1)){const w=x.getDay();if(w&&w<6)d++}
 if($('#aHalf').value==='1')d=d?d-0.5:0.5;
 const b=bal[$('#aType').value];
 $('#aCalc').textContent=`${d} working day${d===1?'':'s'}`+(b?` · ${b.t-b.u} ${$('#aType').value.toLowerCase()} days available`:'');
 return d;
}
function render(){kpis();rows();week();types();emp()}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const r=reqs.find(x=>x.id==b.dataset.id);r.s=b.dataset.a;
 if(r.n==='Vamsi M'&&r.s==='approved'&&bal[r.t])bal[r.t].u+=r.d;
 render();toast(`${r.n.split(' ')[0]}'s ${r.t.toLowerCase()} leave ${r.s}`);
});
$('#q').addEventListener('input',rows);$('#f').addEventListener('change',rows);
['#aFrom','#aTo','#aType','#aHalf'].forEach(s=>$(s).addEventListener('change',calc));
$('#apply').addEventListener('submit',e=>{
 e.preventDefault();const d=calc();if(!d)return;
 const t=$('#aType').value,b=bal[t];
 if(b&&d>b.t-b.u){toast('Not enough balance for this leave type');return}
 reqs.unshift({id:Date.now(),n:'Vamsi M',t,f:$('#aFrom').value,to:$('#aTo').value,d,s:'pending',r:$('#aReason').value.trim()||'—'});
 $('#aReason').value='';render();toast('Request sent to your manager for approval');
});
function view(hr){
 $('#hr').classList.toggle('hide',!hr);$('#emp').classList.toggle('hide',hr);
 $('#vHR').classList.toggle('on',hr);$('#vEmp').classList.toggle('on',!hr);
 $('#title').textContent=hr?'Good evening, Priya':'Hi Vamsi';
 $('#subtitle').textContent=hr?'HR Admin · Acme Technologies · 42 employees':'Software Engineer · Engineering · Reports to Arjun Rao';
}
$('#vHR').addEventListener('click',()=>view(true));$('#vEmp').addEventListener('click',()=>view(false));
render();
}
</script>
</body>
</html>
